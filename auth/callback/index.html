<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-RD6BRB6HW6SAV5m9XLGTAt5T4JP0eEpUhwoMAJitddY='; base-uri 'none'; form-action 'none'">
<title>Role Makers — accesso</title>
<!--
  Audit Play Store, punto 8 — fallback WEB dell'App Link
  https://rolemakers.it/auth/callback.

  Con l'app installata e il dominio verificato (/.well-known/assetlinks.json)
  Android consegna questo indirizzo direttamente all'app e questa pagina non
  viene mai aperta. Qui si arriva solo se l'app non è installata, se il
  dominio non è (ancora) verificato sul dispositivo, o aprendo il link da un
  computer.

  Regole di sicurezza della pagina:
  - non elabora MAI codici o token: non li scambia, non li salva, non li
    inoltra (nessuna richiesta di rete, nessun link che li contenga);
  - li rimuove subito dalla barra degli indirizzi e dalla cronologia;
  - mostra solo messaggi fissi: il testo dell'eventuale errore non viene
    mai inserito come HTML.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #14161A; color: #E9E6DF; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  p { color: #B9B4AA; line-height: 1.5; }
  a { color: #D9A441; }
</style>
</head>
<body>
<main>
  <h1 id="title">Accesso a Role Makers</h1>
  <p id="message">Questo indirizzo serve a completare l'accesso nell'app Role Makers.</p>
  <p id="hint"></p>
  <p><a href="/">Vai a Role Makers</a></p>
</main>
<script>
(function () {
  var search = new URLSearchParams(window.location.search);
  var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  var has = function (k) { return search.has(k) || hash.has(k); };
  var hadSecret = has('code') || has('access_token') || has('refresh_token');
  var isError = has('error') || has('error_description') || has('error_code');
  var isSignup = hash.get('type') === 'signup';
  // Via codici e token dalla barra e dalla cronologia, prima di tutto.
  try { window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
  var title = document.getElementById('title');
  var message = document.getElementById('message');
  var hint = document.getElementById('hint');
  if (isError) {
    title.textContent = 'Accesso non completato';
    message.textContent = 'L’accesso è stato annullato o non è riuscito. Riprova dall’app Role Makers.';
  } else if (isSignup) {
    title.textContent = 'Email confermata';
    message.textContent = 'Il tuo indirizzo è confermato. Apri l’app Role Makers (o il sito) e accedi con email e password.';
  } else if (hadSecret) {
    title.textContent = 'Completa l’accesso nell’app';
    message.textContent = 'Questo link va aperto con l’app Role Makers installata sul telefono da cui hai avviato l’accesso. Per sicurezza qui non viene completato nulla.';
    hint.textContent = 'Se l’app è installata ma si è aperto il browser, torna all’app e avvia di nuovo l’accesso.';
  }
})();
</script>
</body>
</html>
